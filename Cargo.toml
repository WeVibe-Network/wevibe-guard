[package]
name    = "wevibe-guard"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Prompt injection and credential scanner for WeVibe Network"
repository  = "https://github.com/WeVibe-Network/wevibe-guard"
homepage    = "https://github.com/WeVibe-Network/wevibe-guard"
readme      = "README.md"
keywords    = ["security", "yara", "prompt-injection", "credential-scanner", "wevibe-network"]
categories  = ["command-line-utilities", "development-tools"]

[lib]
name = "wevibe_guard"

[dependencies]
yara-x  = "1.14"
regex   = "1"
once_cell = "1"
serde   = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.21"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "scan_bench"
harness = false

[[bin]]
name = "wevibe-guard"
path = "src/main.rs"
